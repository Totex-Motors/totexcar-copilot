name: Deploy Fidelidade (página de vendas)

# Deploy da página de vendas do Cartão Fidelidade (fidelidade/) como projeto
# PRÓPRIO na Vercel — separado do totexcar-copilot e do jjespetos. O projeto é
# criado/atualizado pelo nome do diretório de deploy ("totexfidelidade" →
# https://totexfidelidade.vercel.app, se o subdomínio estiver livre; senão a
# Vercel escolhe um sufixo e a URL sai no log).
#
# Dispara no push da main quando fidelidade/ muda, e manualmente (workflow_dispatch).
# Reusa os mesmos segredos do deploy principal: VERCEL_TOKEN e VERCEL_ORG_ID
# (NÃO seta VERCEL_PROJECT_ID — isso apontaria pro projeto do Co-pilot).

on:
  push:
    branches: [main]
    paths:
      - 'fidelidade/**'
  workflow_dispatch:

# NÃO exportar VERCEL_ORG_ID como env: com ela setada o CLI exige também
# VERCEL_PROJECT_ID. O escopo do time vai por --scope na linha de comando.
concurrency:
  group: deploy-fidelidade
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel (fidelidade)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy (site estático, projeto totexfidelidade)
        run: |
          set -o pipefail
          # pasta de deploy com o nome do projeto (o --yes cria o projeto com esse nome)
          mkdir -p /tmp/totexfidelidade
          cp fidelidade/index.html /tmp/totexfidelidade/index.html
          cp fidelidade/guia.html /tmp/totexfidelidade/guia.html
          cp fidelidade/jj.html /tmp/totexfidelidade/jj.html
          cp fidelidade/brasa.html /tmp/totexfidelidade/brasa.html
          cp fidelidade/brasa-guia.html /tmp/totexfidelidade/brasa-guia.html
          cp fidelidade/og.jpg /tmp/totexfidelidade/og.jpg
          cp fidelidade/jj-home.jpg /tmp/totexfidelidade/jj-home.jpg
          cp fidelidade/brasa-home.jpg /tmp/totexfidelidade/brasa-home.jpg
          cp fidelidade/brasa-logo.png /tmp/totexfidelidade/brasa-logo.png
          # FÁBRICA: painel interno + geradores + cópia do MOTOR (o painel busca app-engine.html pra montar o app de cada cliente)
          cp fidelidade/fabrica.html /tmp/totexfidelidade/fabrica.html
          cp fidelidade/fabrica-generators.js /tmp/totexfidelidade/fabrica-generators.js
          cp jj-fidelidade/index.html /tmp/totexfidelidade/app-engine.html
          # anti-cache: os HTML sempre frescos; as imagens seguem cacheáveis
          NS='no-store, max-age=0, must-revalidate'
          printf '{"headers":[{"source":"/","headers":[{"key":"Cache-Control","value":"%s"}]},{"source":"/index.html","headers":[{"key":"Cache-Control","value":"%s"}]},{"source":"/guia.html","headers":[{"key":"Cache-Control","value":"%s"}]},{"source":"/jj.html","headers":[{"key":"Cache-Control","value":"%s"}]},{"source":"/brasa.html","headers":[{"key":"Cache-Control","value":"%s"}]},{"source":"/brasa-guia.html","headers":[{"key":"Cache-Control","value":"%s"}]},{"source":"/fabrica.html","headers":[{"key":"Cache-Control","value":"%s"}]},{"source":"/fabrica-generators.js","headers":[{"key":"Cache-Control","value":"%s"}]},{"source":"/app-engine.html","headers":[{"key":"Cache-Control","value":"%s"}]}]}' "$NS" "$NS" "$NS" "$NS" "$NS" "$NS" "$NS" "$NS" "$NS" > /tmp/totexfidelidade/vercel.json
          cat /tmp/totexfidelidade/vercel.json
          cd /tmp/totexfidelidade
          vercel deploy --prod --yes \
            --scope "${{ secrets.VERCEL_ORG_ID }}" \
            --token "${{ secrets.VERCEL_TOKEN }}" 2>&1 | tee deploy.log
          URL=$(grep -Eo 'https://[a-z0-9.-]+\.vercel\.app' deploy.log | tail -1)
          echo "----------------------------------------"
          echo "Deployment: $URL"
          echo "Aliases de produção do projeto:"
          vercel inspect "$URL" --scope "${{ secrets.VERCEL_ORG_ID }}" --token "${{ secrets.VERCEL_TOKEN }}" 2>&1 | sed -n '1,40p' || true
