name: Deploy

# Deploy automático na Vercel a cada push na main (merge de PR) — e disparável
# manualmente (Actions → Deploy → Run workflow, ou via API).
#
# Por que via CLI e não pela integração Vercel↔GitHub: o repo é PRIVADO, então
# o checkout aqui usa o token do próprio GitHub Actions e o deploy usa um token
# da Vercel — sem depender do app da Vercel enxergar o repo privado.
#
# Segredos necessários (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       — token pessoal da Vercel (vercel.com/account/tokens)
#   VERCEL_ORG_ID      — de microsaas-clean/.vercel/project.json após `vercel link`
#   VERCEL_PROJECT_ID  — idem
#
# O app fica em microsaas-clean/ (por isso working-directory).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vercel
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microsaas-clean
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy (prebuilt)
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
