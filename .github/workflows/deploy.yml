name: Deploy

# Deploy na Vercel a cada push na main + manual (workflow_dispatch).
# Sobe o código e deixa a Vercel INSTALAR e BUILDAR no servidor dela (evita
# problemas de build local tipo "vite not found"). Funciona com repo privado:
# o upload é direto via token da Vercel, sem depender do app GitHub↔Vercel.
#
# Segredos (Settings → Secrets and variables → Actions → Repository secrets):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# App em microsaas-clean/.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vercel
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microsaas-clean
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy (Vercel builds on its servers)
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
