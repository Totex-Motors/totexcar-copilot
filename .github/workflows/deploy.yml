name: Deploy

# Deploy na Vercel a cada push na main + manual (workflow_dispatch).
# Sobe o código e a Vercel INSTALA e BUILDA no servidor dela (evita build
# local). Funciona com repo privado (upload via token, sem app GitHub↔Vercel).
#
# IMPORTANTE: rodar da RAIZ do repo. O projeto na Vercel já tem
# "Root Directory = microsaas-clean" configurado — se rodar de dentro de
# microsaas-clean, o caminho dobra (microsaas-clean/microsaas-clean).
#
# Segredos (Settings → Secrets and variables → Actions → Repository secrets):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vercel
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy (Vercel builds on its servers; root dir vem do projeto)
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
