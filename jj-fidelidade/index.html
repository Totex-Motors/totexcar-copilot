<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#180e08">
<meta name="description" content="Compre 10 costelas no bafo ou 10 frangos e ganhe um almoço completo grátis! Acompanhe seus selos pelo celular.">
<meta property="og:title" content="J.J Restaurante e Espetaria — Cartão Fidelidade">
<meta property="og:description" content="Compre 10 costelas no bafo ou 10 frangos e ganhe um almoço completo grátis! Acompanhe seus selos pelo celular.">
<meta property="og:image" content="https://jjespetos.vercel.app/og.jpg">
<meta property="og:image:width" content="900">
<meta property="og:image:height" content="1125">
<meta property="og:url" content="https://jjespetos.vercel.app/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="J.J Espetos">
<meta name="twitter:card" content="summary_large_image">
<title>J.J Fidelidade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap">
<style>
  /* ================= J.J ESPETOS — tema único "brasa à noite" ================= */
  :root{
    --char:#180e08;        /* fundo espresso */
    --char-2:#211309;      /* fundo gradiente */
    --smoke:#332013;       /* superfície marrom */
    --smoke-2:#402a19;     /* superfície elevada */
    --line:#573926;        /* bordas quentes */
    --card:#f6efe1;        /* papel creme do cartão físico */
    --card-2:#efe5cf;
    --ember:#e8862b;       /* laranja do logo */
    --ember-soft:#f0a45a;
    --flame:#c93e18;       /* vermelho fogo */
    --ink:#4a3226;         /* marrom "Cartão" */
    --ink-soft:#7a5c44;
    --cream:#f3e8d2;       /* texto claro sobre escuro */
    --cream-dim:#c9b295;
    --good:#7cb86a;
    --danger:#e05b4b;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --display:'Alfa Slab One',Georgia,serif;
    --body:'Nunito Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(120% 90% at 50% -10%, var(--char-2) 0%, var(--char) 60%) fixed, var(--char);
    color:var(--cream);
    font-family:var(--body);
    font-size:16px;line-height:1.5;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:var(--body);cursor:pointer}
  input,select,textarea{font-family:var(--body)}
  ::selection{background:var(--ember);color:var(--char)}

  .app{max-width:460px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1}

  /* ---------- fogo da churrasqueira (canvas em TELA CHEIA: fogo embaixo,
       fumaça subindo até o topo, faíscas voando alto) ---------- */
  #fireCanvas{
    position:fixed;inset:0;width:100%;height:100%;
    z-index:0;pointer-events:none;
  }
  /* chamas do logo tremeluzindo (só o logo da marca; os selos ficam parados) */
  .logo-mark path{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.1s ease-in-out infinite alternate}
  .logo-mark path:nth-of-type(2){animation-duration:.8s;animation-delay:.25s}
  @keyframes flick{
    from{transform:scaleY(1) scaleX(1)}
    to{transform:scaleY(1.06) scaleX(.97)}
  }
  .app.wide{max-width:760px}

  /* ---------- topo ---------- */
  header.top{
    display:flex;align-items:center;gap:12px;
    padding:18px 20px 10px;
  }
  .logo-mark{width:46px;height:46px;flex:none}
  .brand{display:flex;flex-direction:column;line-height:1.05}
  .brand b{font-family:var(--display);font-weight:400;font-size:19px;color:var(--ember);letter-spacing:.5px}
  .brand span{font-size:11px;letter-spacing:.28em;color:var(--cream-dim);text-transform:uppercase;font-weight:700}
  header.top .spacer{flex:1}
  .pill-btn{
    background:transparent;border:1px solid var(--line);color:var(--cream-dim);
    border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;
    transition:color .15s,border-color .15s;
  }
  .pill-btn:hover{color:var(--cream);border-color:var(--ember)}
  .pill-btn.active{background:var(--ember);border-color:var(--ember);color:var(--char)}

  main{flex:1;padding:8px 20px 96px;display:flex;flex-direction:column;gap:16px}

  h1.screen-title{font-family:var(--display);font-weight:400;font-size:24px;color:var(--cream);margin:6px 0 0;text-wrap:balance}
  .muted{color:var(--cream-dim);font-size:14px;margin:0}

  /* ---------- abas inferiores ---------- */
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;z-index:40;
    display:flex;justify-content:center;gap:8px;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(24,14,8,.72) 30%, rgba(24,14,8,0)); /* translúcido: o fogo aparece atrás */
  }
  nav.tabs .wrap{
    display:flex;gap:6px;background:var(--smoke);border:1px solid var(--line);
    border-radius:999px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  nav.tabs button{
    border:0;background:transparent;color:var(--cream-dim);
    font-weight:800;font-size:14px;padding:10px 22px;border-radius:999px;
    transition:background .15s,color .15s;
  }
  nav.tabs button.active{background:var(--ember);color:var(--char)}

  /* ---------- o cartão ---------- */
  .loyalty-card{
    background:linear-gradient(160deg, var(--card) 0%, var(--card-2) 100%);
    border-radius:18px;
    padding:22px 20px 18px;
    color:var(--ink);
    box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.6);
    position:relative;overflow:hidden;
  }
  .loyalty-card::before{ /* leve textura de papel */
    content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:
      radial-gradient(1px 1px at 12% 30%, rgba(74,50,38,.08) 0 1px, transparent 1px),
      radial-gradient(1px 1px at 68% 62%, rgba(74,50,38,.07) 0 1px, transparent 1px),
      radial-gradient(1px 1px at 40% 85%, rgba(74,50,38,.07) 0 1px, transparent 1px);
    background-size:90px 90px,70px 70px,110px 110px;
  }
  .lc-head{display:flex;align-items:flex-start;gap:clamp(6px,2vw,12px);position:relative}
  .lc-head .logo-mark{width:clamp(38px,11vw,52px);height:clamp(38px,11vw,52px)}
  .lc-title{flex:1;text-align:center;padding-top:2px;min-width:0}
  .lc-title .cartao{font-family:var(--display);font-weight:400;font-size:clamp(14px,4.6vw,20px);color:var(--ink);line-height:1}
  .lc-title .fide{font-family:var(--display);font-weight:400;font-size:clamp(19px,6.8vw,30px);color:var(--ember);letter-spacing:.5px;line-height:1.15;text-shadow:0 1px 0 rgba(255,255,255,.5)}
  .lc-code{
    text-align:right;font-family:var(--mono);font-size:clamp(11px,3.2vw,13px);font-weight:700;
    color:var(--ink-soft);letter-spacing:.06em;white-space:nowrap;
  }
  .lc-name{
    font-size:clamp(12px,3.6vw,15px);font-weight:800;color:var(--ink);
    text-transform:uppercase;letter-spacing:.04em;margin-top:2px;text-align:right;
    max-width:26vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .stamp-grid{
    display:grid;grid-template-columns:repeat(5,1fr);gap:12px;
    margin:20px 6px 18px;position:relative;
  }
  .slot{
    aspect-ratio:1;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #b9a487, #a08a6b 70%);
    box-shadow:inset 0 2px 6px rgba(74,50,38,.35);
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .slot svg{width:100%;height:100%;display:block;border-radius:50%}
  .slot.stamped svg{animation:stampIn .45s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes stampIn{
    0%{transform:scale(2.1) rotate(-14deg);opacity:0}
    60%{transform:scale(.92) rotate(2deg);opacity:1}
    100%{transform:scale(1) rotate(-3deg)}
  }
  .slot.stamped:nth-child(even) svg{transform:rotate(4deg)}

  /* bolinha vazia = braseiro com FOGO SIMULADO (combustão procedural em canvas) */
  .slot.burning{
    background:radial-gradient(circle at 50% 40%, #2b1709, #1a0d05 70%, #140a04);
    border:2.5px solid #b9a487;
    overflow:hidden;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.6), 0 0 16px rgba(232,110,30,.4);
  }
  .slot.burning canvas{
    position:absolute;inset:0;width:100%;height:100%;
    border-radius:50%;
  }
  /* celebração do selo novo no cartão do CLIENTE: a bolinha "enche" com zoom
     e o fogo intensifica antes de explodir em faíscas e carimbar */
  .slot.burning.charging{
    z-index:6;
    animation:chargeUp .95s cubic-bezier(.45,0,.25,1) forwards;
  }
  .slot.burning.charging canvas{filter:brightness(1.4) saturate(1.25)}
  @keyframes chargeUp{
    0%{transform:scale(1);box-shadow:inset 0 2px 8px rgba(0,0,0,.6), 0 0 16px rgba(232,110,30,.4)}
    55%{transform:scale(1.28)}
    100%{transform:scale(1.5);box-shadow:inset 0 2px 8px rgba(0,0,0,.6), 0 0 48px rgba(255,150,40,.9)}
  }
  .lc-rule{
    position:relative;
    background:linear-gradient(135deg, var(--ember) 0%, #d97722 100%);
    color:#fff8ec;border-radius:14px;
    font-weight:800;font-size:13.5px;line-height:1.45;
    padding:12px 16px;text-align:center;
    text-shadow:0 1px 2px rgba(120,50,0,.35);
  }
  .loyalty-card.full{box-shadow:0 18px 50px rgba(0,0,0,.55), 0 0 0 3px var(--ember), 0 0 42px rgba(232,134,43,.45)}

  .progress-note{display:flex;align-items:center;gap:10px;justify-content:center;font-weight:700;color:var(--cream-dim);font-size:14px}
  .progress-note b{color:var(--ember-soft)}
  .reward-banner{
    background:linear-gradient(135deg,#2c1a0c,#3a230e);
    border:1px solid var(--ember);border-radius:16px;
    padding:16px 18px;text-align:center;
    animation:glow 1.6s ease-in-out infinite alternate;
  }
  @keyframes glow{from{box-shadow:0 0 8px rgba(232,134,43,.25)}to{box-shadow:0 0 26px rgba(232,134,43,.55)}}
  .reward-banner h2{font-family:var(--display);font-weight:400;color:var(--ember);font-size:20px;margin:0 0 4px}
  .reward-banner p{margin:0;color:var(--cream);font-size:14px;font-weight:600}

  /* ---------- formulários ---------- */
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--cream-dim)}
  .field input,.field select{
    background:var(--smoke);border:1px solid var(--line);border-radius:12px;
    color:var(--cream);font-size:16px;padding:13px 14px;outline:none;
    transition:border-color .15s;width:100%;
  }
  .field input:focus,.field select:focus{border-color:var(--ember)}
  .field input::placeholder{color:#8a6f57}
  .btn{
    border:0;border-radius:12px;padding:14px 18px;
    font-size:15px;font-weight:800;letter-spacing:.02em;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .1s,filter .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{background:linear-gradient(135deg,var(--ember),#d97722);color:var(--char)}
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--cream)}
  .btn-ghost:hover{border-color:var(--ember)}
  .btn-danger{background:transparent;border:1px solid var(--danger);color:var(--danger)}
  .btn-block{width:100%}
  .btn[disabled]{opacity:.4;cursor:not-allowed}

  .panel{
    background:var(--smoke);border:1px solid var(--line);border-radius:16px;
    padding:18px;display:flex;flex-direction:column;gap:14px;
  }
  .panel h3{margin:0;font-size:15px;font-weight:800;color:var(--cream)}

  /* ---------- admin ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .stat{
    background:var(--smoke);border:1px solid var(--line);border-radius:14px;
    padding:12px 10px;text-align:center;
  }
  .stat b{display:block;font-family:var(--display);font-weight:400;font-size:24px;color:var(--ember);font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--cream-dim)}

  .search-row{display:flex;flex-direction:row;gap:8px}
  .search-row input{flex:1}

  .client-list{display:flex;flex-direction:column;gap:8px}
  .client-row{
    display:flex;align-items:center;gap:12px;
    background:var(--smoke);border:1px solid var(--line);border-radius:14px;
    padding:12px 14px;transition:border-color .15s;text-align:left;width:100%;
    color:var(--cream);
  }
  .client-row:hover{border-color:var(--ember)}
  .client-row .who{flex:1;min-width:0}
  .client-row .who b{display:block;font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .client-row .who span{font-family:var(--mono);font-size:12px;color:var(--cream-dim)}
  .dots{display:flex;gap:3px;flex-wrap:wrap;max-width:96px;justify-content:flex-end}
  .dots i{width:9px;height:9px;border-radius:50%;background:#513824}
  .dots i.on{background:var(--ember)}
  .row-count{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--cream-dim);white-space:nowrap}
  .row-count b{color:var(--ember-soft)}

  .empty{
    text-align:center;color:var(--cream-dim);font-size:14px;
    border:1px dashed var(--line);border-radius:14px;padding:26px 16px;
  }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed;inset:0;z-index:60;background:rgba(10,5,2,.72);
    display:flex;align-items:flex-end;justify-content:center;
    animation:fadeIn .18s ease both;
  }
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .sheet{
    width:100%;max-width:460px;max-height:88vh;overflow-y:auto;
    background:var(--char-2);border:1px solid var(--line);border-bottom:0;
    border-radius:22px 22px 0 0;padding:20px 20px 28px;
    display:flex;flex-direction:column;gap:14px;
    animation:slideUp .22s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet-head{display:flex;align-items:center;gap:10px}
  .sheet-head h2{flex:1;margin:0;font-family:var(--display);font-weight:400;font-size:20px;color:var(--cream)}
  .close-x{background:transparent;border:1px solid var(--line);color:var(--cream-dim);border-radius:50%;width:34px;height:34px;font-size:16px;line-height:1}

  .history{display:flex;flex-direction:column;gap:6px;max-height:180px;overflow-y:auto}
  .history li{
    list-style:none;display:flex;justify-content:space-between;gap:10px;
    font-size:13px;padding:8px 10px;border-radius:10px;background:var(--smoke);
  }
  .history{padding:0;margin:0}
  .history .h-what{font-weight:700}
  .history .h-when{color:var(--cream-dim);font-family:var(--mono);font-size:12px;white-space:nowrap}
  .h-stamp .h-what{color:var(--ember-soft)}
  .h-redeem .h-what{color:var(--good)}

  /* ---------- pin ---------- */
  .pin-box{display:flex;flex-direction:column;gap:14px;align-items:center;padding:26px 0 8px}
  .pin-dots{display:flex;gap:14px}
  .pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
  .pin-dots i.on{background:var(--ember);border-color:var(--ember)}
  .pin-pad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
  .pin-pad button{
    height:60px;border-radius:16px;background:var(--smoke);border:1px solid var(--line);
    color:var(--cream);font-size:22px;font-weight:800;
  }
  .pin-pad button:active{background:var(--smoke-2)}
  .pin-err{color:var(--danger);font-weight:700;font-size:14px;min-height:20px;margin:0}
  .shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  .toast{
    position:fixed;left:50%;bottom:92px;transform:translateX(-50%);
    background:var(--card);color:var(--ink);font-weight:800;font-size:14px;
    border-radius:999px;padding:11px 20px;z-index:80;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    animation:toastIn .25s ease both;white-space:nowrap;
  }
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

  .admin-sub{display:flex;gap:6px}
  .admin-sub button{
    flex:1;border:1px solid var(--line);background:transparent;color:var(--cream-dim);
    border-radius:12px;padding:10px;font-weight:800;font-size:13px;
  }
  .admin-sub button.active{background:var(--smoke-2);color:var(--ember);border-color:var(--ember)}

  .footer-note{text-align:center;font-size:12px;color:#8a6f57;padding:4px 20px 0}

  /* ---------- indicação ---------- */
  .voucher-code{
    font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.08em;
    color:var(--ember);text-align:center;
    border:2px dashed var(--ember);border-radius:12px;padding:10px 14px;
    background:rgba(232,134,43,.07);
  }
  .invite-hero{
    background:linear-gradient(160deg, var(--card) 0%, var(--card-2) 100%);
    border-radius:18px;padding:24px 20px;color:var(--ink);text-align:center;
    box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.6);
    display:flex;flex-direction:column;gap:12px;align-items:center;
  }
  .invite-hero .iv-eyebrow{font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft)}
  .invite-hero .iv-title{font-family:var(--display);font-weight:400;font-size:26px;color:var(--ember);line-height:1.15;text-wrap:balance}
  .invite-hero .iv-from{font-size:15px;font-weight:800;color:var(--ink)}
  .invite-hero .voucher-code{font-size:30px;background:#fff}
  .invite-hero .iv-rule{font-size:14px;font-weight:700;color:var(--ink);line-height:1.55}
  .invite-hero .iv-rule b{color:var(--flame)}

  /* ---------- ranking de indicações ---------- */
  .rank-row{align-items:center}
  .rank-row.rank-top{border-color:var(--ember);box-shadow:0 0 18px rgba(232,134,43,.18)}
  .rank-pos{flex:none;width:36px;text-align:center;font-size:20px;font-weight:800;color:var(--cream-dim)}
  .rank-bar{height:6px;border-radius:99px;background:#402a19;margin-top:6px;overflow:hidden}
  .rank-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--flame),var(--ember))}
  .rank-count{text-align:right;font-size:12px;font-weight:700;color:var(--cream-dim);white-space:nowrap;line-height:1.4}
  .rank-count b{display:block;font-family:var(--display);font-weight:400;font-size:20px;color:var(--ember);font-variant-numeric:tabular-nums}
  .rank-count em{display:block;font-style:normal;color:var(--good)}

  /* ---------- QR ---------- */
  .qr-row{display:flex;align-items:center;gap:14px}
  .qr-box{
    background:#fff;border-radius:12px;padding:9px;flex:none;
    display:flex;align-items:center;justify-content:center;
    min-width:118px;min-height:118px;
  }
  .qr-box img,.qr-box canvas{display:block}
  .qr-box .qr-missing{max-width:100px;font-size:11px;color:#7a5c44;text-align:center;font-weight:700}
  .qr-hint{font-size:13px;color:var(--cream-dim);font-weight:600;margin:0}
  .qr-hint b{color:var(--cream)}

  /* ---------- cartaz de impressão (só aparece no print) ---------- */
  #poster{display:none}
  @media print{
    body{background:#fff!important}
    body.printing .app,body.printing nav.tabs,body.printing .overlay,body.printing .toast{display:none!important}
    body.printing #poster{
      display:flex;flex-direction:column;align-items:center;text-align:center;
      color:#1c0f07;font-family:var(--body);
      padding:12mm 10mm;gap:6mm;
    }
    #poster .p-logo{width:34mm;height:34mm}
    #poster .p-cartao{font-family:var(--display);font-weight:400;font-size:26pt;color:#4a3226;line-height:1}
    #poster .p-fide{font-family:var(--display);font-weight:400;font-size:40pt;color:#e8862b;line-height:1.1}
    #poster .p-sub{font-size:14pt;font-weight:800;color:#4a3226;margin-top:2mm}
    #poster .p-qr{padding:6mm;border:1.2mm solid #1c0f07;border-radius:8mm}
    #poster .p-qr img,#poster .p-qr canvas{width:62mm!important;height:62mm!important}
    #poster .p-code{font-family:var(--mono);font-size:16pt;font-weight:700;color:#4a3226;letter-spacing:.08em}
    #poster .p-steps{font-size:12pt;font-weight:700;color:#1c0f07;line-height:1.7;max-width:150mm}
    #poster .p-rule{

<script>
/* =====================================================================
   J.J ESPETOS — Cartão Fidelidade digital + painel admin (v1, arquivo único)
   Dados no localStorage. Backup por exportar/importar JSON no Admin › Ajustes.
   ===================================================================== */
(function(){
'use strict';

// Carimbo da versão (o deploy troca 'DEV' por um id real). Serve pra AUTO-ATUALIZAR
// clientes que ficaram com uma versão antiga em cache — some com o "não abre o cartão".
const APP_BUILD = 'DEV';
async function autoUpdate(){
  if(APP_BUILD === 'DEV') return;                 // build local: não faz nada
  try{
    const r = await fetch('v.txt?cb=' + Date.now(), { cache: 'no-store' });
    if(!r.ok) return;
    const server = (await r.text()).trim();
    if(server && server !== APP_BUILD){
      const n = +(sessionStorage.getItem('jj_upd') || 0);
      if(n < 2){ sessionStorage.setItem('jj_upd', String(n + 1)); location.reload(); }
    }
  }catch(e){ /* offline: ignora, tenta na próxima */ }
}

const LS_KEY = 'jj_fidelidade_v1';
const DEFAULTS = {
  settings:{ pin:'123456', goal:10, reward:'um almoço completo grátis',
    rule:'Compre 10 costelas no bafo ou 10 frangos e ganhe um almoço completo grátis!',
    plan:'ilimitado',   // plano da loja → limite de clientes (essencial 50 / crescimento 150 / ilimitado)
    operadorPin:'',     // PIN do balcão (operador, ex.: o Junior); vazio = desativado. Só o dono muda plano/PINs.
    appUrl:'',      // endereço público do app (usado nos QR e na mensagem); vazio = o endereço atual
    waApi:false,    // false = envio grátis (abre o WhatsApp); true = automático pela instância de API
    // endpoint + chave: conectam o BANCO NA NUVEM (e o envio por API, se ligado)
    waEndpoint:'https://gkkjhnzkqhpgrwrmofev.supabase.co/functions/v1/jj-fidelidade',
    waKey:'64d10fcbb90742423a67440828c853b7',
    // ===== IDENTIDADE DA MARCA (manifesto) — muda por cliente; o motor só lê =====
    // Ausente/incompleto = usa estes padrões (a J.J). Um cliente novo troca só isto.
    brand:{ name:'J.J Espetos', shortName:'J.J', legalName:'J.J Restaurante e Espetaria',
      initials:'J.J', tagline:'ESPETOS', prefix:'JJ', appTitle:'J.J Fidelidade',
      address:'Av. Tenente Marques, 06 — Polvilho, Cajamar',
      colorEmber:'#e8862b', colorFlame:'#c93e18' } },
  seq: 1,
  customers: []
};

// INJEÇÃO POR-CLIENTE (deploy da fábrica): o build injeta um window.__TENANT__ = {settings:{...}}
// no cabeçalho da página e isso sobrescreve os padrões (marca, chave da nuvem, meta,
// recompensa...) para este cliente. Sem isso, nada muda — a J.J segue idêntica.
try{
  var T = (typeof window!=='undefined') ? window.__TENANT__ : null;
  if(T && T.settings){
    var baseBrand = DEFAULTS.settings.brand;
    var tBrand = T.settings.brand;
    Object.assign(DEFAULTS.settings, T.settings);
    DEFAULTS.settings.brand = Object.assign({}, baseBrand, tBrand||{});
  }
}catch(e){}

function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const d = JSON.parse(raw);
      d.settings = Object.assign({}, DEFAULTS.settings, d.settings||{});
      // endpoint/chave vazios (versões antigas) quebrariam a nuvem — restaura o padrão
      if(!d.settings.waEndpoint) d.settings.waEndpoint = DEFAULTS.settings.waEndpoint;
      if(!d.settings.waKey) d.settings.waKey = DEFAULTS.settings.waKey;
      d.settings.brand = Object.assign({}, DEFAULTS.settings.brand, d.settings.brand||{});
      d.customers = (d.customers||[]).filter(c=>!isDemoJunior(c)); // limpa o cliente-demo antigo
      d.seq = d.seq||1; return d; }
  }catch(e){}
  const d = JSON.parse(JSON.stringify(DEFAULTS)); // primeiro uso: começa VAZIO (sem cliente-demo)
  save(d);
  return d;
}
// assinatura do antigo cliente-demo "Junior" (JJ-0001) que era criado sozinho —
// nunca é tratado como cliente real nem sobe pra nuvem
function isDemoJunior(c){
  return !!c && c.code === 'JJ-0001' && String(c.name||'').trim().toLowerCase() === 'junior'
    && !c.phone && !c.referredBy && !c.redeemed
    && (c.history||[]).every(h => h.t === 'stamp');
}
function save(d){ try{ localStorage.setItem(LS_KEY, JSON.stringify(d)); }catch(e){} }

// identidade da marca em uso (com fallback para os padrões da J.J)
function brand(){ return (db && db.settings && db.settings.brand) || DEFAULTS.settings.brand; }

function makeCustomer(d, name, phone){
  const code = ((d.settings.brand && d.settings.brand.prefix) || 'JJ') + '-' + String(d.seq++).padStart(4,'0');
  return { id: code, code, name: name.trim(), phone: (phone||'').trim(),
           stamps:0, redeemed:0, createdAt: Date.now(), history:[] };
}

// planos e trava de limite de clientes
const PLAN_MAX  = { essencial:50, crescimento:150, ilimitado:Infinity };
const PLAN_NAME = { essencial:'Essencial', crescimento:'Crescimento', ilimitado:'Ilimitado' };
function planMax(){ const m = PLAN_MAX[db.settings.plan]; return m===undefined ? Infinity : m; }
function planName(){ return PLAN_NAME[db.settings.plan] || 'Ilimitado'; }
function realCount(){ return db.customers.filter(c=>!isDemoJunior(c)).length; }
function atLimit(){ return realCount() >= planMax(); }

let db = load();
let state = {
  tab:'card',            // card | admin
  adminOk:false,
  adminSub:'clientes',   // clientes | novo | ajustes
  search:'',
  cardCode: localStorage.getItem(LS_KEY+':mycard') || '',
  invite: (function(){ try{ return JSON.parse(localStorage.getItem(LS_KEY+':invite')||'null'); }catch(e){ return null; } })(),
  detail:null,           // id do cliente aberto no modal
  role:null,             // 'super' (dono) | 'operador' (balcão, ex.: Junior)
  pinBuf:'', pinErr:false
};

/* ---------- helpers ---------- */
const $app = document.getElementById('app');
const esc = s => String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtDate = ts => new Date(ts).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'})
  + ' ' + new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
/* telefone tolerante: casa com/sem +55, com/sem o nono dígito, com/sem DDD */
function matchPhone(a, b){
  const canon = v => { let d = String(v||'').replace(/\D/g,''); if(d.length > 11 && d.startsWith('55')) d = d.slice(2); return d; };
  a = canon(a); b = canon(b);
  if(a.length < 8 || b.length < 8) return false;
  if(a === b) return true;
  if(a.slice(-8) !== b.slice(-8)) return false;    // mesmos 8 finais…
  const da = a.length >= 10 ? a.slice(0,2) : '', db2 = b.length >= 10 ? b.slice(0,2) : '';
  return !da || !db2 || da === db2;                // …e, se ambos têm DDD, o DDD bate
}
const byCodeOrPhone = q => {
  q = q.trim().toLowerCase();
  if(!q) return null;
  return db.customers.find(c =>
    c.code.toLowerCase() === q ||
    c.code.toLowerCase() === ('jj-'+q).toLowerCase() ||
    matchPhone(c.phone, q)
  ) || null;
};

/* ---------- QR + WhatsApp ---------- */
function appUrl(){
  const cfg = (db.settings.appUrl||'').trim().replace(/\/+$/,'');
  if(cfg) return cfg;
  return /^https?:$/.test(location.protocol) ? location.origin + location.pathname : '';
}
function cardUrl(code){ const b = appUrl(); return b ? b + '?c=' + encodeURIComponent(code) : ''; }
function inviteUrl(c){
  const b = appUrl(); if(!b) return '';
  const first = (c.name||'').trim().split(/\s+/)[0];
  return b + '?i=' + encodeURIComponent(c.code) + (first ? '&n=' + encodeURIComponent(first) : '');
}
function phone55(p){ const d = String(p||'').replace(/\D/g,''); return d.length<=11 ? '55'+d : d; }

function renderQRs(root){
  (root||document).querySelectorAll('[data-qr]').forEach(el=>{
    el.innerHTML='';
    const text = el.dataset.qr;
    if(!text){ el.innerHTML = '<span class="qr-missing">Defina o endereço público do app em Admin › Ajustes</span>'; return; }
    if(!window.QRCode){ el.innerHTML = '<span class="qr-missing">'+esc(text)+'</span>'; return; }
    new QRCode(el, { text, width: parseInt(el.dataset.size||'110',10), height: parseInt(el.dataset.size||'110',10),
      colorDark:'#1c0f07', colorLight:'#ffffff', correctLevel: QRCode.CorrectLevel.M });
  });
}

async function sendCardWA(c, opts){
  opts = opts || {};
  const ep = (db.settings.waEndpoint||'').trim(), k = (db.settings.waKey||'').trim(), url = cardUrl(c.code);
  if(!c.phone){ if(!opts.silent) toast('Este cliente não tem telefone cadastrado.'); return; }
  if(!db.settings.waApi || !ep || !k){ if(!opts.silent) waFallback(c); return; } // modo grátis: abre o WhatsApp direto
  if(!url){ if(!opts.silent) toast('Defina o endereço público do app em Ajustes.'); return; }
  toast('Enviando cartão no WhatsApp…');
  try{
    const r = await fetch(ep, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'send_card', k, phone: phone55(c.phone), name: c.name,
        code: c.code, stamps: c.stamps, goal: db.settings.goal, url }) });
    const j = await r.json().catch(()=>({}));
    if(j.ok){ toast('📲 Cartão enviado no WhatsApp de '+c.name+'!'); return; }
    if(j.error==='aguarde_10min'){ toast('Já foi enviado há pouco — aguarde uns minutos.'); return; }

      if(opts.silent){ toast('WhatsApp ainda não configurado (Ajustes) — use o botão na ficha do cliente.'); return; }

  }catch(e){
    if(opts.silent){ toast('Sem conexão com o servidor de envio.'); return; }
    waFallback(c, 'Sem conexão com o servidor');
  }
}

/* leitor de QR do balcão: aponta a câmera pro cartão do cliente e abre a ficha */
async function scanCard(){
  if(!('BarcodeDetector' in window) || !navigator.mediaDevices?.getUserMedia){
    toast('Leitura por câmera não disponível neste navegador — digite o código na busca.');
    return;
  }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } }); }
  catch(e){ toast('Não consegui acessar a câmera — verifique a permissão.'); return; }
  const ov = document.createElement('div');
  ov.className='overlay'; ov.style.alignItems='center';
  ov.innerHTML = `<div class="sheet" style="border-radius:22px;max-width:380px;border-bottom:1px solid var(--line)">
    <div class="sheet-head"><h2>Escanear cartão</h2><button class="close-x" aria-label="Fechar">✕</button></div>
    <video autoplay playsinline muted style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;background:#000"></video>
    <p class="muted" style="font-size:13px;text-align:center;margin:0">Aponte para o QR do cartão do cliente.</p>
  </div>`;
  document.body.appendChild(ov);
  const video = ov.querySelector('video');
  video.srcObject = stream;
  let stop = false;
  const cleanup = ()=>{ stop = true; stream.getTracks().forEach(t=>t.stop()); ov.remove(); };
  ov.querySelector('.close-x').addEventListener('click', cleanup);
  ov.addEventListener('click', e=>{ if(e.target===ov) cleanup(); });
  const det = new BarcodeDetector({ formats:['qr_code'] });
  while(!stop){
    try{
      const codes = await det.detect(video);
      for(const b of codes){
        const raw = String(b.rawValue||'');
        const m = raw.match(/[?&][ci]=([^&]+)/); // aceita link do cartão (?c=) ou de convite (?i=)
        const code = decodeURIComponent(m ? m[1] : raw).toUpperCase().trim();
        const found = byCodeOrPhone(code);
        if(found){
          cleanup();
          state.tab='admin'; state.adminSub='clientes'; state.detail = found.id;
          render(); toast('Cartão de '+found.name+' aberto!');
          return;
        }
      }
    }catch(e){ /* frame ainda não decodificável — tenta de novo */ }
    await new Promise(r=>setTimeout(r, 350));
  }
}

/* =====================================================================
   NUVEM — o banco de dados de verdade. O login do admin puxa o estado da
   nuvem (fonte da verdade); toda mudança agenda um push. O celular do
   cliente busca só o próprio cartão (card_pull, sem PIN). localStorage
   vira cache/fallback: se a nuvem cair, o app segue local e re-tenta.
   ===================================================================== */
let authPin = null;      // PIN validado no login (autoriza pull/push)
let cloudOk = null;      // null = ainda não tentou, true = sincronizado, false = falhou
let syncTimer = null;

function syncCfg(){
  const s = db.settings;
  return (s.waEndpoint||'').trim() && (s.waKey||'').trim()
    ? { ep: s.waEndpoint.trim(), k: s.waKey.trim() } : null;
}
function cloudBadgeText(){
  return cloudOk === true ? '☁️ Dados sincronizados na nuvem'
       : cloudOk === false ? '⚠️ Sem nuvem agora — salvo neste aparelho, tentando de novo'
       : '☁️ Conectando à nuvem…';
}
function updateCloudBadge(){
  const el = document.getElementById('cloudBadge');
  if(el) el.textContent = cloudBadgeText();
}
function scheduleSync(){
  if(!syncCfg() || !authPin) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushState, 700);
}
async function pushState(){
  const cfg = syncCfg(); if(!cfg || !authPin) return;
  try{
    const r = await fetch(cfg.ep, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'state_push', k: cfg.k, pin: authPin, data: db }) });
    const j = await r.json().catch(()=>({}));
    cloudOk = !!j.ok;
    if(j.ok) authPin = (state.role==='operador') ? (db.settings.operadorPin||authPin) : db.settings.pin; // PIN novo passa a valer após gravado
    else if(j.error==='pin_invalido') toast('⚠️ PIN diferente do da nuvem — dados não sincronizados.');
    else if(j.error==='limite_plano') toast('🔒 Limite de clientes do plano atingido — esse cadastro não foi salvo na nuvem.');
    else scheduleSync();                                // erro transitório: tenta de novo
  }catch(e){ cloudOk = false; scheduleSync(); }
  updateCloudBadge();
}
async function pullState(pin){
  const cfg = syncCfg(); if(!cfg) return { status:'sem_config', hadData:false };
  try{
    const r = await fetch(cfg.ep, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'state_pull', k: cfg.k, pin }) });
    const j = await r.json().catch(()=>({}));
    if(j.ok){
      cloudOk = true;
      if(j.data && Array.isArray(j.data.customers)){
        const cloud = j.data;
        cloud.settings = Object.assign({}, DEFAULTS.settings, cloud.settings||{});
        if(!cloud.settings.waEndpoint) cloud.settings.waEndpoint = DEFAULTS.settings.waEndpoint;
        if(!cloud.settings.waKey) cloud.settings.waKey = DEFAULTS.settings.waKey;
        cloud.settings.brand = Object.assign({}, DEFAULTS.settings.brand, cloud.settings.brand||{});
        cloud.seq = Math.max(cloud.seq||1, db.seq||1);
        // FUSÃO anti-perda: cliente que só existe neste aparelho (push que não
        // chegou à nuvem) NÃO pode sumir no pull — entra na nuvem agora.
        let merged = 0;
        for(const lc of db.customers){
          if(isDemoJunior(lc)) continue;               // cliente-demo nunca sobe pra nuvem
          const cc = cloud.customers.find(x => x.code === lc.code);
          if(!cc){
            cloud.customers.push(lc); merged++;
          } else if(cc.name !== lc.name){
            // colisão de código (numeração recomeçou num aparelho zerado): recodifica o local
            const nc = Object.assign({}, lc);
            nc.code = ((cloud.settings.brand && cloud.settings.brand.prefix) || 'JJ') + '-' + String(cloud.seq++).padStart(4,'0'); nc.id = nc.code;
            cloud.customers.push(nc); merged++;
          } else if((lc.history||[]).length > (cc.history||[]).length){
            Object.assign(cc, lc); merged++;            // local mais adiantado (selo não sincado)
          }
        }
        db = cloud; save(db);
        return { status:'ok', hadData:true, merged };
      }
      return { status:'ok', hadData:false };            // nuvem ainda vazia (primeiro uso)
    }
    if(j.error==='pin_invalido') return { status:'pin', hadData:true };
    cloudOk = false; return { status:'erro', hadData:false };
  }catch(e){ cloudOk = false; return { status:'off', hadData:false }; }
}
/* cartão do cliente em qualquer aparelho: busca só o próprio cartão na nuvem */
function upsertRemoteCard(j){
  let c = db.customers.find(x=>x.code===j.customer.code);
  if(!c){
    c = { id:j.customer.code, code:j.customer.code, name:j.customer.name, phone:'',
          stamps:0, redeemed:0, createdAt:Date.now(), history:[] };
    db.customers.push(c);
  }
  c.name = j.customer.name; c.stamps = j.customer.stamps|0; c.redeemed = j.customer.redeemed|0;
  if(j.rules){
    if(j.rules.goal) db.settings.goal = j.rules.goal;
    if(j.rules.reward) db.settings.reward = j.rules.reward;
    if(j.rules.rule) db.settings.rule = j.rules.rule;
  }
  save(db);
  return c;
}
async function remoteFind(q, quiet){
  const cfg = syncCfg(); if(!cfg){ if(!quiet) toast('Cartão não encontrado. Confira o código.'); return; }
  try{
    const r = await fetch(cfg.ep, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ action:'card_pull', k: cfg.k, code: String(q).trim() }) });
    const j = await r.json().catch(()=>({}));
    if(j.ok && j.found){
      const c = upsertRemoteCard(j);
      state.cardCode = c.code; localStorage.setItem(LS_KEY+':mycard', c.code);
      state.tab='card'; render();
      celebrateIfNeeded(c);                           // selo novo? festa no cartão
    } else if(!quiet) toast('Cartão não encontrado. Confira o código.');
  }catch(e){ if(!quiet) toast('Sem conexão — tente de novo.'); }
}

/* ============ CELEBRAÇÃO NO CARTÃO DO CLIENTE ============
   Selo novo detectado (na nuvem ou ao abrir o cartão): a bolinha em chamas
   cresce com zoom e o fogo intensifica ("enchendo"), explode em faíscas no
   lugar exato, e o carimbo aparece. Cartão completo = explosão dourada. */
let celebrating = false;
function celebrateIfNeeded(c){
  if(!c) return;
  const key = LS_KEY+':seen:'+c.code;
  const raw = localStorage.getItem(key);
  // primeira visita neste aparelho: celebra só o selo mais recente
  const from = raw === null ? Math.max(0, c.stamps - 1)
                            : Math.min(parseInt(raw,10)||0, c.stamps);
  if(c.stamps > from && state.tab === 'card' && !state.detail){
    runCelebration(c, from, c.stamps);
  } else {
    localStorage.setItem(key, String(c.stamps));
  }
}
async function runCelebration(c, from, to){
  if(celebrating) return;
  celebrating = true;
  const key = LS_KEY+':seen:'+c.code;
  const wait = ms => new Promise(r=>setTimeout(r, ms));
  c._show = from; render();
  await wait(600);                                   // o cartão assenta, fogo aceso
  for(let i = from; i < to; i++){
    const slot = document.querySelectorAll('.stamp-grid .slot')[i];
    if(slot){
      slot.classList.add('charging');                // enche com zoom + fogo forte
      await wait(950);
      const b = slot.getBoundingClientRect();
      sparkBurst(b.left + b.width/2, b.top + b.height/2, i+1 >= db.settings.goal);
      await wait(120);                               // clarão antes do carimbo
    }
    c._show = i + 1;
    localStorage.setItem(key, String(i + 1));
    render();                                        // carimbo entra com a batida
    await wait(1000);
  }
  delete c._show;
  celebrating = false;
  render();
}

/* explosão de faíscas — dispara no ponto do toque quando o selo é dado.
   Canvas temporário ACIMA de tudo, remove-se sozinho quando a última faísca apaga. */
let lastTap = { x: 0, y: 0 };
function sparkBurst(x, y, big){
  x = x || innerWidth/2; y = y || innerHeight/2;
  const cv = document.createElement('canvas');
  cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;z-index:120;pointer-events:none';
  document.body.appendChild(cv);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth*dpr); cv.height = Math.round(innerHeight*dpr);
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const N = big ? 130 : 80, ps = [];
  for(let i=0; i<N; i++){
    const a = Math.random()*6.283, v = 2.2 + Math.random()*(big ? 9 : 6.5);
    ps.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 2.2,
      r: 1 + Math.random()*2.4, life: .85 + Math.random()*.35,
      gold: Math.random() < (big ? .5 : .25) });
  }
  let flash = big ? .5 : .35; // clarão inicial de brasa
  (function anim(){
    c.clearRect(0, 0, innerWidth, innerHeight);
    c.globalCompositeOperation = 'lighter';
    if(flash > 0){
      const g = c.createRadialGradient(x, y, 0, x, y, big ? 190 : 130);
      g.addColorStop(0, 'rgba(255,190,90,'+flash+')');
      g.addColorStop(1, 'rgba(255,120,40,0)');
      c.fillStyle = g; c.beginPath(); c.arc(x, y, big ? 190 : 130, 0, 6.283); c.fill();
      flash -= .06;
    }
    let alive = 0;
    for(const p of ps){
      if(p.life <= 0) continue;
      alive++;
      p.x += p.vx; p.y += p.vy;
      p.vy += .16; p.vx *= .985;              // gravidade + arrasto: faísca de verdade
      p.life -= .016 + Math.random()*.012;
      const col = p.gold ? '255,224,130' : '255,170,70';
      const halo = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*4);
      halo.addColorStop(0, 'rgba('+col+','+(.4*p.life)+')');
      halo.addColorStop(1, 'rgba('+col+',0)');
      c.fillStyle = halo;
      c.beginPath(); c.arc(p.x, p.y, p.r*4, 0, 6.283); c.fill();
      c.fillStyle = 'rgba(255,235,170,'+Math.min(1, p.life)+')';
      c.beginPath(); c.arc(p.x, p.y, p.r*Math.max(.35, p.life), 0, 6.283); c.fill();
    }
    if(alive || flash > 0) requestAnimationFrame(anim);
    else cv.remove();
  })();
}

/* =====================================================================
   FireSlots — FOGO REAL simulado (algoritmo de propagação de calor do
   DOOM): cada bolinha sem selo tem um buffer de combustão onde o calor
   nasce na base, sobe com decaimento aleatório e vento lateral. Nada é
   keyframe: cada frame é único, com núcleo branco-quente, línguas
   laranja e pontas que se desprendem. Renderiza em baixa resolução e o
   navegador suaviza no upscale (visual de fogo de verdade).
   ===================================================================== */
const FireSlots = (function(){
  // paleta do frio→branco-quente (37 níveis, base do DOOM) com alfa na cauda
  const RGB = [
    [7,7,7],[31,7,7],[47,15,7],[71,15,7],[87,23,7],[103,31,7],[119,31,7],[143,39,7],
    [159,47,7],[175,63,7],[191,71,7],[199,71,7],[223,79,7],[223,87,7],[223,87,7],[215,95,7],
    [215,95,7],[215,103,15],[207,111,15],[207,119,15],[207,127,15],[207,135,23],[199,135,23],[199,143,23],
    [199,151,31],[191,159,31],[191,159,31],[191,167,39],[191,167,39],[191,175,47],[183,175,47],[183,183,47],
    [183,183,55],[207,207,111],[223,223,159],[239,239,199],[255,255,255]
  ];
  const PAL = RGB.map((c,i)=>[c[0],c[1],c[2], i===0?0 : i<8 ? 30+i*28 : 255]);
  const MAXH = 36; // calor máximo (índice da paleta)
  const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function makeSim(cv, cw, ch, seedFn){
    cv.width = cw; cv.height = ch;
    const ctx = cv.getContext('2d');
    const buf = new Uint8Array(cw*ch);
    const img = ctx.createImageData(cw, ch);
    return { cv, ctx, buf, img, w:cw, h:ch, seedFn, t:0 };
  }
  function step(s){
    s.t++;
    s.seedFn(s);
    const {buf, w, h} = s;
    for(let y=h-1; y>0; y--){
      const row = y*w, above = row-w;
      for(let x=0; x<w; x++){
        const v = buf[row+x];
        if(v === 0){ buf[above+x] = 0; continue; }
        const r = Math.random();
        // decaimento: quanto mais alto, mais o calor se perde (línguas afinam)
        const decay = r < .38 ? 0 : r < .80 ? 1 : 2;
        // vento/turbulência lateral; nas paredes o calor se dissipa
        // (sem isso ele acumula e vira uma coluna brilhante na borda)
        const dx = (Math.random()*3|0) - 1;
        let tx = x + dx, wall = 0;
        if(tx < 0){ tx = 0; wall = 3; } else if(tx >= w){ tx = w-1; wall = 3; }
        const nv = v - decay - wall;
        buf[above+tx] = nv > 0 ? nv : 0;
      }
    }
  }
  function paint(s){
    const {buf, img} = s, d = img.data;
    for(let i=0; i<buf.length; i++){
      const p = PAL[buf[i]], o = i*4;
      d[o]=p[0]; d[o+1]=p[1]; d[o+2]=p[2]; d[o+3]=p[3];
    }
    s.ctx.putImageData(img, 0, 0);
  }
  // base da chama da bolinha: forte no centro, fraca nas bordas, com "respiração"
  function slotSeed(s){
    const {buf, w, h} = s, base = (h-1)*w;
    const breathe = .8 + .2*Math.sin(s.t/23 + s.phase);
    for(let x=0; x<w; x++){
      const cx = Math.abs(x - w/2) / (w/2);            // 0 centro → 1 borda
      let v = cx < .58 ? MAXH * breathe * (1 - cx*.6) : 0;
      if(Math.random() < .12) v *= .4;                  // tremor de carvão
      buf[base+x] = Math.min(MAXH, v|0);
    }
  }

  let sims = [], raf = null;
  function collect(){
    sims = [];
    document.querySelectorAll('canvas.slot-fire').forEach(cv=>{
      const s = makeSim(cv, 34, 42, slotSeed);
      s.phase = Math.random()*6.28;                     // cada braseiro no seu ritmo
      // pré-aquecimento: nasce já queimando, não "sobe do zero"
      for(let i=0; i<50; i++) step(s);
      paint(s);
      sims.push(s);
    });
    // o fogo roda SEMPRE (canvas/JS não depende da config de animação do
    // aparelho — decisão de produto: a chama é a alma do app)
    if(!raf && sims.length) raf = requestAnimationFrame(loop);
    if(!sims.length && raf){ cancelAnimationFrame(raf); raf = null; }
  }
  let odd = false;
  function loop(){
    raf = null;
    if(document.hidden){ raf = requestAnimationFrame(loop); return; }
    odd = !odd;
    if(odd){                                             // ~30fps: cadência de fogo real
      for(const s of sims){ if(!s.cv.isConnected) continue; step(s); paint(s); }
      sims = sims.filter(s=>s.cv.isConnected);
    }
    if(sims.length) raf = requestAnimationFrame(loop);
  }
  return { collect, makeSim, step, paint, MAXH, PAL, reduced };
})();

      <div class="pin-dots">${dots}</div>
      <p class="pin-err">${state.pinErr?'PIN errado. Tenta de novo.':state.pinBusy?'Conectando à nuvem…':''}</p>
      <div class="pin-pad">${keys.map(k=>`<button data-key="${k}">${k==='ok'?'✓':k}</button>`).join('')}</div>
    </div>
  </main>`;
}

/* ---------- eventos ---------- */
function bind(){
  $app.querySelectorAll('[data-act]').forEach(el=> el.addEventListener('click', (e)=>{
    lastTap = { x: e.clientX || 0, y: e.clientY || 0 };
    action(el.dataset.act);
  }));
  $app.querySelectorAll('[data-sub]').forEach(el=> el.addEventListener('click', ()=>{ state.adminSub = el.dataset.sub; render(); }));
  $app.querySelectorAll('[data-open]').forEach(el=> el.addEventListener('click', ()=>{ state.detail = el.dataset.open; render(); }));
  $app.querySelectorAll('[data-close]').forEach(el=> el.addEventListener('click', e=>{ if(e.target===el){ state.detail=null; render(); } }));
  $app.querySelectorAll('[data-key]').forEach(el=> el.addEventListener('click', ()=> pinKey(el.dataset.key)));

  const s = $app.querySelector('#searchInp');
  if(s){ s.addEventListener('input', ()=>{ state.search = s.value; renderListOnly(); });
         if(state.search) { s.focus(); s.setSelectionRange(s.value.length,s.value.length); } }

  const f = $app.querySelector('#findCard');
  if(f) f.addEventListener('keydown', e=>{ if(e.key==='Enter') action('find'); });

  const imp = $app.querySelector('#impFile');
  if(imp) imp.addEventListener('change', importBackup);
}
function renderListOnly(){ // busca sem perder foco
  const wrap = $app.querySelector('.client-list');
  if(!wrap) return;
  const tmp = document.createElement('div'); tmp.innerHTML = adminClientes();
  wrap.replaceWith(tmp.querySelector('.client-list'));
  $app.querySelectorAll('[data-open]').forEach(el=> el.addEventListener('click', ()=>{ state.detail = el.dataset.open; render(); }));
}

function pinKey(k){
  if(k==='←'){ state.pinBuf = state.pinBuf.slice(0,-1); state.pinErr=false; }
  else if(k==='ok'){ checkPin(); return; }
  else { state.pinBuf = (state.pinBuf + k).slice(0,6); state.pinErr=false;
         if(state.pinBuf.length===6){ checkPin(); return; } }
  render();
}
async function checkPin(){
  if(state.pinBusy) return;
  const pin = state.pinBuf; state.pinBuf='';
  state.pinBusy = true; state.pinErr = false; render();
  // nuvem primeiro: é a fonte da verdade dos clientes e selos
  const res = await pullState(pin);
  state.pinBusy = false;
  if(res.status === 'ok' && res.hadData){
    state.adminOk = true; authPin = pin;
    state.role = (pin === db.settings.pin) ? 'super' : 'operador';
    if(res.merged){ scheduleSync(); toast('☁️ '+res.merged+' registro(s) deste aparelho enviados pra nuvem.'); }
  } else if(res.status === 'pin'){
    state.pinErr = true;
  } else {
    // nuvem vazia ou fora do ar: valida local; o primeiro push cria o banco
    if(pin === db.settings.pin){ state.adminOk = true; authPin = pin; state.role='super'; scheduleSync(); }
    else if(db.settings.operadorPin && pin === db.settings.operadorPin){ state.adminOk = true; authPin = pin; state.role='operador'; scheduleSync(); }
    else state.pinErr = true;
  }
  render();
  updateCloudBadge();
}

function action(act){
  const c = state.detail ? db.customers.find(x=>x.id===state.detail) : null;
  switch(act){
    case 'find':{
      const v = $app.querySelector('#findCard').value;
      const found = byCodeOrPhone(v);
      if(!found){ toast('Buscando seu cartão…'); remoteFind(v); return; }
      state.cardCode = found.code;
      localStorage.setItem(LS_KEY+':mycard', found.code);
      render(); break;
    }
    case 'forget':
      state.cardCode=''; localStorage.removeItem(LS_KEY+':mycard'); render(); break;
    case 'shareInvite': shareInvite(byCodeOrPhone(state.cardCode)); break;
    case 'shareInviteAdmin': shareInvite(c); break;
    case 'dismissInvite':
      state.invite=null; localStorage.removeItem(LS_KEY+':invite'); render(); break;
    case 'lock':
      state.adminOk=false; state.role=null; authPin=null; state.pinBuf=''; render(); break;
    case 'create':{
      const name = $app.querySelector('#npName').value.trim();
      const phone = $app.querySelector('#npPhone').value.trim();
      if(!name){ toast('Falta o nome do cliente.'); return; }
      if(atLimit()){ toast('🔒 Limite de '+planMax()+' clientes do plano '+planName()+' atingido. Fale com o Totex pra liberar mais.'); return; }
      const refCode = ($app.querySelector('#npRef').value||'').trim().toUpperCase();
      const nc = makeCustomer(db, name, phone);
      let refMsg = '';
      if(refCode){
        const ref = byCodeOrPhone(refCode);
        if(!ref){ refMsg = ' Voucher '+refCode+' não encontrado — nenhum selo de indicação dado.'; }
        else {
          nc.referredBy = ref.code;
          if(ref.stamps < db.settings.goal){
            ref.stamps++;
            ref.history.push({t:'referral', ts:Date.now(), friend: nc.name});
            refMsg = ' 🤝 +1 selo para '+ref.name+' pela indicação!';
          } else {
            refMsg = ' Cartão de '+ref.name+' já está cheio — resgate o prêmio antes de somar o selo da indicação.';
          }
        }
      }
      db.customers.push(nc); save(db); scheduleSync();
      state.adminSub='clientes'; state.detail = nc.id; state.search='';
      render(); toast(`Cartão ${nc.code} criado para ${nc.name}!`+refMsg);
      if(nc.phone){
        const api = db.settings.waApi && (db.settings.waEndpoint||'').trim() && (db.settings.waKey||'').trim();
        if(api) sendCardWA(nc, {silent:true});  // envio automático por API (opcional)
        else waFallback(nc);                    // modo grátis: abre o WhatsApp com a mensagem pronta
      }
      break;
    }
    case 'sendWA': if(c) sendCardWA(c); break;
    case 'printCard': if(c) printPoster(c); break;
    case 'printPoster': printPoster(null); break;
    case 'scan': scanCard(); break;
    case 'stamp':{
      if(!c) return;
      c.stamps++; c.history.push({t:'stamp', ts:Date.now()}); save(db); scheduleSync();
      render();
      const full = c.stamps >= db.settings.goal;
      toast(full ? `🎉 ${c.name} completou o cartão!` : `Selo ${c.stamps}/${db.settings.goal} para ${c.name}`);
      break;
    }
    case 'unstamp':{
      if(!c || c.stamps<=0) return;
      c.stamps--;
      for(let i=c.history.length-1;i>=0;i--){ if(c.history[i].t==='stamp'||c.history[i].t==='referral'){ c.history.splice(i,1); break; } }
      save(db); scheduleSync(); render(); break;
    }
    case 'redeem':{
      if(!c) return;
      if(!confirm(`Entregar ${db.settings.reward} para ${c.name} e zerar o cartão?`)) return;
      c.stamps = 0; c.redeemed++; c.history.push({t:'redeem', ts:Date.now()}); save(db); scheduleSync();
      render();
      toast(`🏆 Prêmio entregue para ${c.name}!`); break;
    }
    case 'delClient':{
      if(!c) return;
      if(!confirm(`Excluir ${c.name} (${c.code})? Isso apaga o histórico.`)) return;
      db.customers = db.customers.filter(x=>x.id!==c.id); save(db); scheduleSync();
      state.detail=null; render(); toast('Cliente excluído.'); break;
    }
    case 'saveSettings':{
      db.settings.goal = parseInt($app.querySelector('#stGoal').value,10)||10;
      db.settings.reward = $app.querySelector('#stReward').value.trim()||DEFAULTS.settings.reward;
      db.settings.rule = $app.querySelector('#stRule').value.trim()||DEFAULTS.settings.rule;
      db.settings.appUrl = $app.querySelector('#stAppUrl').value.trim();
      // campos de WhatsApp só existem no acesso do dono — lê se estiverem na tela
      const waMode=$app.querySelector('#stWaMode'); if(waMode) db.settings.waApi = waMode.value==='api';
      const waEp=$app.querySelector('#stWaEp'); if(waEp) db.settings.waEndpoint = waEp.value.trim() || DEFAULTS.settings.waEndpoint;
      const waKey=$app.querySelector('#stWaKey'); if(waKey) db.settings.waKey = waKey.value.trim() || DEFAULTS.settings.waKey;
      db.customers.forEach(x=>{ if(x.stamps>db.settings.goal) x.stamps=db.settings.goal; });
      save(db); scheduleSync(); render(); toast('Regras salvas!'); break;
    }
    case 'saveAccess':{
      if(state.role!=='super') return;               // só o dono muda plano/PIN do operador
      const plan = $app.querySelector('#stPlan').value;
      db.settings.plan = ['essencial','crescimento','ilimitado'].includes(plan) ? plan : 'ilimitado';
      const op = ($app.querySelector('#stOpPin').value||'').trim();
      if(op && !/^\d{6}$/.test(op)){ toast('O PIN do operador precisa ter 6 números (ou vazio).'); return; }
      db.settings.operadorPin = op;
      save(db); scheduleSync(); render(); toast('Plano e acesso salvos!'); break;
    }
    case 'savePin':{
      if(state.role!=='super') return;
      const p = $app.querySelector('#stPin').value.trim();
      if(!/^\d{6}$/.test(p)){ toast('O PIN precisa ter 6 números.'); return; }
      db.settings.pin = p; save(db); scheduleSync(); toast('PIN do dono atualizado!'); break;
    }
    case 'export':{
      if(state.role!=='super') return;
      const blob = new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'jj-fidelidade-backup-' + new Date().toISOString().slice(0,10) + '.json';
      a.click(); URL.revokeObjectURL(a.href); break;
    }
  }
}

function importBackup(e){
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.customers)) throw new Error('formato');
      d.settings = Object.assign({}, DEFAULTS.settings, d.settings||{});
      d.seq = d.seq || (d.customers.length+1);
      db = d; save(db); scheduleSync(); render(); toast('Backup importado!');
    }catch(err){ toast('Arquivo inválido — use um backup exportado daqui.'); }
  };
  r.readAsText(f);
}

/* ---------- abas ---------- */
document.getElementById('tabCard').addEventListener('click', ()=>{
  state.tab='card'; state.detail=null; render();
  const c = state.cardCode ? byCodeOrPhone(state.cardCode) : null;
  if(c) celebrateIfNeeded(c);
});
setInterval(()=>{ if(state.tab==='card' && state.cardCode && !document.hidden && !celebrating) refreshCard(); }, 15000);
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && state.tab==='card' && state.cardCode && !celebrating) refreshCard();
});
document.getElementById('tabAdmin').addEventListener('click', ()=>{ state.tab='admin'; render(); });

/* =====================================================================
   Fogo da churrasqueira: chamas na base da tela, brasas voando e
   fumaça subindo. Canvas leve (~90 partículas), pausa quando a aba
   fica oculta e vira um brilho parado se a pessoa prefere menos
   animação (prefers-reduced-motion).
   ===================================================================== */
(function fire(){
  const cv = document.getElementById('fireCanvas');
  if(!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  const rnd = (a,b) => a + Math.random() * (b - a);
  // brasas concentradas em "focos", como carvão aceso espalhado na grelha
  const spots = () => { const n = Math.max(3, Math.round(W/130)); return Array.from({length:n}, (_,i) => (i + .5) * W/n + rnd(-30,30)); };
  let hot = spots();
  addEventListener('resize', () => { hot = spots(); });

  const smokes = [], embers = [];

  // fogueira REAL: faixa de simulação de combustão (mesmo motor das bolinhas),
  // semeada nos focos de brasa — línguas de fogo orgânicas, nunca repetidas
  const CELL = 5;
  let hearth = null;
  function hearthSeed(s){
    const {buf, w, h} = s, base = (h-1)*w;
    buf.fill(0, base, base + w);
    for(const hx of hot){
      const cx = Math.round(hx / CELL);
      const breathe = .72 + .28*Math.sin(s.t/26 + cx);
      const spread = 3 + (Math.random()*2|0);
      for(let dx=-spread; dx<=spread; dx++){
        const x = cx + dx;
        if(x < 0 || x >= w) continue;
        const fall = 1 - Math.abs(dx)/(spread+1);
        buf[base+x] = Math.max(buf[base+x], (FireSlots.MAXH * breathe * fall) | 0);
      }
    }
    // carvões espalhados entre os focos
    for(let x=0; x<w; x++) if(buf[base+x]===0 && Math.random()<.08) buf[base+x] = 4 + (Math.random()*6|0);
  }
  let FH = 240; // altura da faixa de fogo na base (o resto da tela é da fumaça)
  function rebuildHearth(){
    FH = Math.round(Math.min(300, Math.max(200, H * .32)));
    const off = document.createElement('canvas');
    hearth = FireSlots.makeSim(off, Math.max(20, Math.ceil(W/CELL)), Math.max(16, Math.ceil(FH/CELL)), hearthSeed);
    hearth.phase = 0;
    for(let i=0; i<60; i++) FireSlots.step(hearth); // já nasce queimando
    FireSlots.paint(hearth);
  }
  rebuildHearth();
  addEventListener('resize', rebuildHearth);

  // (as chamas laterais foram testadas e removidas a pedido do dono —
  //  ficaram fortes demais; o clima vem da fogueira + fumaça + faíscas)
  function spawnSmoke(){
    // nasce na ponta das chamas e sobe ATÉ O TOPO da tela
    const x = hot[Math.floor(Math.random()*hot.length)] + rnd(-40,40);
    smokes.push({ x, y: H - FH*rnd(.5,.85), r: rnd(12,22), vy: rnd(1.5,2.8), vx: rnd(-.2,.2), wob: rnd(0,6.28), life: 1 });
  }
  function spawnEmber(){
    const x = hot[Math.floor(Math.random()*hot.length)] + rnd(-16,16);
    embers.push({ x, y: H - rnd(10,70), vy: rnd(1.6,3.2), vx: rnd(-.35,.35), r: rnd(1,2.6), wob: rnd(0,6.28), life: 1 });
  }

  // o fogo roda SEMPRE — não depende da configuração de animação do aparelho
  let t = 0, running = true;
  document.addEventListener('visibilitychange', () => {
    running = !document.hidden;
    if(running) requestAnimationFrame(tick);
  });

  function tick(){
    if(!running) return;
    t++;
    ctx.clearRect(0, 0, W, H);

    // brilho de brasa respirando na zona do fogo
    const breathe = .32 + Math.sin(t/34) * .08;
    const gtop = H - FH*1.9;
    const bg = ctx.createLinearGradient(0, H, 0, gtop);
    bg.addColorStop(0, 'rgba(201,62,24,'+breathe+')');
    bg.addColorStop(.5, 'rgba(232,134,43,.09)');
    bg.addColorStop(1, 'rgba(232,134,43,0)');
    ctx.fillStyle = bg; ctx.fillRect(0, Math.max(0,gtop), W, H - Math.max(0,gtop));

    // fumaça: colunas que sobem ATÉ O TOPO, abrindo e serpenteando
    if(smokes.length < 42 && Math.random() < .6) spawnSmoke();
    ctx.globalCompositeOperation = 'source-over';
    for(let i = smokes.length - 1; i >= 0; i--){
      const p = smokes[i];
      p.vy += .006;                                     // fumaça acelera ao subir
      p.y -= p.vy;
      p.x += p.vx + Math.sin(p.wob + t/26) * .55;       // serpenteia
      p.r += .17; p.life -= .0034;
      if(p.life <= 0 || p.y < -70){ smokes.splice(i,1); continue; }
      const born = 1 - p.life;                          // aparece suave, morre suave
      const a = .17 * p.life * Math.min(1, born * 6);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, 'rgba(172,150,132,'+a+')');
      g.addColorStop(1, 'rgba(172,150,132,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }

    // fogo simulado na base (a cada 2 frames = cadência natural de chama)
    if(t % 2 === 0){ FireSlots.step(hearth); FireSlots.paint(hearth); }
    ctx.globalCompositeOperation = 'lighter';
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(hearth.cv, 0, H - FH, W, FH);

    // faíscas voando ALTO, com halo de brasa
    if(embers.length < 26 && Math.random() < .45) spawnEmber();
    for(let i = embers.length - 1; i >= 0; i--){
      const p = embers[i];
      p.y -= p.vy; p.x += p.vx + Math.sin(p.wob + t/7) * .5;
      p.life -= .006;
      if(p.life <= 0 || p.y < -10){ embers.splice(i,1); continue; }
      const halo = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r*4);
      halo.addColorStop(0, 'rgba(255,170,70,'+(.35*p.life)+')');
      halo.addColorStop(1, 'rgba(255,170,70,0)');
      ctx.fillStyle = halo;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*4, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'rgba(255,214,120,'+(.95*p.life)+')';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * Math.max(.4,p.life), 0, 6.283); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();

// chegou por QR? (?c=JJ-0001) → abre direto o cartão
const urlCode = new URLSearchParams(location.search).get('c');
if(urlCode){
  const found = byCodeOrPhone(urlCode);
  if(found){ state.tab='card'; state.cardCode = found.code; localStorage.setItem(LS_KEY+':mycard', found.code); }
}
// chegou por convite? (?i=JJ-0001&n=Junior) → guarda e mostra o voucher de indicação
const urlInvite = new URLSearchParams(location.search).get('i');
if(urlInvite){
  state.invite = { code: urlInvite.toUpperCase(), name: new URLSearchParams(location.search).get('n') || '' };
  localStorage.setItem(LS_KEY+':invite', JSON.stringify(state.invite));
  state.tab='card';
}

render();

// auto-atualização: pega versão nova sem o cliente precisar limpar cache
autoUpdate();
setInterval(autoUpdate, 300000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) autoUpdate(); });

// nuvem: cartão do cliente sempre fresco em qualquer aparelho
if(urlCode && !byCodeOrPhone(urlCode)) remoteFind(urlCode, true); // veio por QR e não está neste aparelho
else if(state.cardCode) refreshCard();
})();
</script>
