<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Spline+Sans+Mono:wght@500;600&display=swap">
<style>
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#181009;color:#f6ead6;
    font-family:'Bricolage Grotesque',system-ui,sans-serif;position:relative}
  .glow{position:absolute;top:-180px;right:-160px;width:720px;height:720px;
    background:radial-gradient(circle,rgba(224,127,36,.45),transparent 62%)}
  .grid{position:absolute;inset:0;background:
    linear-gradient(90deg,rgba(234,160,85,.05) 1px,transparent 1px) 0 0/48px 48px,
    linear-gradient(rgba(234,160,85,.05) 1px,transparent 1px) 0 0/48px 48px}
  .pad{position:relative;padding:72px 76px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;gap:16px}
  .mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(150deg,#e07f24,#d0431a);
    display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(208,67,26,.4)}
  .mark svg{width:36px;height:36px;fill:#fff}
  .bname{font-weight:800;font-size:30px;letter-spacing:-.01em}
  .bname small{display:block;font-family:'Spline Sans Mono',monospace;font-size:12px;font-weight:500;
    letter-spacing:.18em;text-transform:uppercase;color:#eaa055;margin-top:3px}
  h1{font-weight:800;font-size:76px;line-height:1.0;letter-spacing:-.03em;max-width:16ch}
  h1 em{font-style:normal;color:#f6a44e}
  .foot{display:flex;align-items:center;gap:18px}
  .pill{font-family:'Spline Sans Mono',monospace;font-size:18px;font-weight:600;letter-spacing:.02em;
    background:rgba(224,127,36,.16);border:1px solid rgba(234,160,85,.4);color:#f6a44e;
    padding:12px 22px;border-radius:100px;display:inline-flex;align-items:center;gap:10px}
  .pill svg{width:19px;height:19px;fill:#f6a44e}
  .sub{font-family:'Spline Sans Mono',monospace;font-size:16px;color:#c9b291;letter-spacing:.02em}
</style></head>
<body>
  <div class="glow"></div><div class="grid"></div>
  <div class="pad">
    <div class="top">
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></span>
      <span class="bname">Cartão Fidelidade<small>por Totex</small></span>
    </div>
    <h1>Troque o cartão de papel por um <em>motor de recompra.</em></h1>
    <div class="foot">
      <span class="pill"><svg viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>Construção grátis · 1º mês por nossa conta</span>
      <span class="sub">selos digitais · indicação no WhatsApp · relatórios</span>
    </div>
  </div>
</body></html>
